<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#2E3440"/>
  <!-- CPU die -->
  <rect x="9" y="9" width="14" height="14" rx="2" fill="#4C566A"/>
  <!-- CPU core -->
  <rect x="12" y="12" width="8" height="8" rx="1" fill="#88C0D0"/>
  <!-- Pins top -->
  <rect x="12" y="5" width="2" height="3" rx="0.5" fill="#81A1C1"/>
  <rect x="18" y="5" width="2" height="3" rx="0.5" fill="#81A1C1"/>
  <!-- Pins bottom -->
  <rect x="12" y="24" width="2" height="3" rx="0.5" fill="#81A1C1"/>
  <rect x="18" y="24" width="2" height="3" rx="0.5" fill="#81A1C1"/>
  <!-- Pins left -->
  <rect x="5" y="12" width="3" height="2" rx="0.5" fill="#81A1C1"/>
  <rect x="5" y="18" width="3" height="2" rx="0.5" fill="#81A1C1"/>
  <!-- Pins right -->
  <rect x="24" y="12" width="3" height="2" rx="0.5" fill="#81A1C1"/>
  <rect x="24" y="18" width="3" height="2" rx="0.5" fill="#81A1C1"/>
