<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CPU Scheduling — gfx-lab</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body,{
      delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]
    })"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prism-themes@1.9.0/themes/prism-nord.css" />
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>

  <style>
    :root {
      --nord0:#2E3440; --nord1:#3B4252; --nord2:#434C5E; --nord3:#4C566A;
      --nord4:#D8DEE9; --nord5:#E5E9F0; --nord6:#ECEFF4;
      --nord7:#8FBCBB; --nord8:#88C0D0; --nord9:#81A1C1; --nord10:#5E81AC;
      --nord11:#BF616A; --nord12:#D08770; --nord13:#EBCB8B;
      --nord14:#A3BE8C; --nord15:#B48EAD;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: var(--nord0);
      color: var(--nord4);
      font-family: 'JetBrains Mono', monospace, sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ──────────────────────────────────────────── */
    #header {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap;
      padding: 0.55rem 1rem;
      background: var(--nord1);
      border-bottom: 1px solid var(--nord3);
      flex-shrink: 0;
    }

    #header label { display:flex; align-items:center; gap:0.35rem; }

    select {
      appearance: none;
      -webkit-appearance: none;
      background: var(--nord2);
      border: 1px solid var(--nord3);
      color: var(--nord6);
      border-radius: 4px;
      padding: 0.2rem 1.5rem 0.2rem 0.45rem;
      font: inherit;
      cursor: pointer;
    }

    .select-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .select-wrap::after {
      content: '▾';
      position: absolute;
      right: 0.42rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--nord9);
      pointer-events: none;
      font-size: 0.85rem;
      line-height: 1;
    }

    button {
      background: var(--nord2);
      border: 1px solid var(--nord3);
      color: var(--nord6);
      border-radius: 4px;
      padding: 0.25rem 0.55rem;
      cursor: pointer;
      font: inherit;
      transition: background 0.12s;
    }
    button:hover { background: var(--nord3); }
    button.active { background: var(--nord10); border-color: var(--nord9); }

    #speed-group { display:flex; gap:0.3rem; align-items:center; }
    #speed-group > span { color:var(--nord9); font-size:0.8rem; margin-right:0.1rem; }

    input[type=range] { accent-color: var(--nord8); cursor:pointer; }

    #sim-clock { margin-left:auto; color:var(--nord8); font-weight:700; white-space:nowrap; }

    /* ── Main 3-column layout ─────────────────────────────── */
    #main {
      display: grid;
      grid-template-columns: 170px 1fr 200px;
      flex: 1;
      min-height: 0; /* prevent flex children from overflowing */
      overflow: hidden;
    }

    section {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid var(--nord2);
    }
    section:last-child { border-right: none; }

    section > h2 {
      padding: 0.4rem 0.75rem;
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--nord8);
      background: var(--nord1);
      border-bottom: 1px solid var(--nord2);
      flex-shrink: 0;
    }
    section > h2[data-tooltip] {
      cursor: help;
      text-decoration: underline dotted var(--nord3);
      text-underline-offset: 3px;
    }

    /* ── Producer ────────────────────────────────────────── */
    #producer { align-items:center; padding-top:2rem; gap:0.4rem; }

    #factory { display:flex; flex-direction:column; align-items:center; gap:0.55rem; }

    #factory-icon { font-size:3rem; line-height:1; user-select:none; }

    @keyframes spin { to { transform:rotate(360deg); } }
    .spinning { animation: spin 1s linear infinite; display:inline-block; }

    #factory-label { font-size:0.72rem; color:var(--nord14); }
    #factory-total { font-size:0.72rem; color:var(--nord4); }

    /* ── Producer controls ───────────────────────────────── */
    #prod-controls {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      padding: 0.6rem 0.75rem 0.3rem;
      width: 100%;
      border-top: 1px solid var(--nord2);
      margin-top: 0.5rem;
    }

    .prod-row {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.68rem;
    }

    .prod-label {
      color: var(--nord9);
      font-size: 0.65rem;
      min-width: 2.8rem;
      flex-shrink: 0;
    }

    .prod-row input[type=range] { flex: 1; min-width: 0; }

    .prod-val { color: var(--nord4); min-width: 2.4rem; text-align: right; flex-shrink: 0; }

    .prod-btns { gap: 0.25rem; }
    .prod-btns button {
      flex: 1;
      font-size: 0.66rem;
      padding: 0.22rem 0.2rem;
      min-width: 0;
    }
    .prod-btns button.active {
      background: var(--nord10);
      border-color: var(--nord9);
    }
    #btn-prod-one { background: var(--nord2); }
    #btn-prod-one:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Ready Queue ─────────────────────────────────────── */
    #queue-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .task-block {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.6rem;
      border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.12);
      flex-shrink: 0;
    }

    /* Progress overlay: darker = already executed, lighter = remaining */
    .task-bar {
      position: absolute;
      left: 0; top: 0; height: 100%;
      background: rgba(0,0,0,0.22);
      pointer-events: none;
      border-radius: 5px 0 0 5px;
      transition: width 0.12s linear;
    }

    /* Currently executing task */
    .task-block.current {
      border-color: rgba(255,255,255,0.6) !important;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.15), 0 2px 12px rgba(255,255,255,0.08);
    }

    /* Divider between running task and waiting tasks */
    .queue-divider {
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin: 0.1rem 0;
      flex-shrink: 0;
    }

    .task-block.starving {
      border-color: var(--nord11) !important;
      animation: pulse-warn 1.4s ease-in-out infinite;
    }

    /* Starvation warning badge */
    .starve-icon {
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--nord11);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      animation: flicker 0.8s ease-in-out infinite alternate;
    }

    @keyframes flicker {
      from { opacity: 1;   box-shadow: 0 0 4px var(--nord11); }
      to   { opacity: 0.4; box-shadow: none; }
    }

    /* Producer spawn button */
    #btn-spawn {
      margin-top: 0.35rem;
      font-size: 0.72rem;
      padding: 0.3rem 0.9rem;
      border-radius: 999px;
      background: var(--nord14);
      border-color: var(--nord14);
      color: var(--nord0);
      font-weight: 600;
    }
    #btn-spawn:hover { background: var(--nord7); border-color: var(--nord7); }

    @keyframes pulse-warn {
      0%,100% { box-shadow: 0 0 0 0 rgba(191,97,106,0.6); }
      50%      { box-shadow: 0 0 0 5px rgba(191,97,106,0); }
    }

    .task-id {
      font-weight: 700;
      font-size: 0.82rem;
      min-width: 2.2rem;
      color: rgba(0,0,0,0.75);
    }

    .task-meta {
      display: flex;
      flex-direction: column;
      gap: 0.08rem;
      flex: 1;
    }
    .task-meta span { font-size:0.67rem; color:rgba(0,0,0,0.6); }

    /* ── CPU Core ────────────────────────────────────────── */
    #cpu-section { align-items:center; padding:1.5rem 1rem; gap:0.85rem; }

    #cpu-slot {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      border: 3px solid var(--nord3);
      background: var(--nord1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: background 0.25s, border-color 0.25s, box-shadow 0.25s;
    }

    #cpu-slot.busy {
      border-color: var(--nord14);
      box-shadow: 0 0 20px rgba(163,190,140,0.3);
    }

    #cpu-task-id   { font-size:1.05rem; font-weight:700; }
    #cpu-remaining { font-size:0.62rem; margin-top:0.12rem; }

    .bar-wrap { width:100%; height:6px; background:var(--nord2); border-radius:3px; overflow:hidden; }
    #cpu-bar  { height:100%; background:var(--nord14); border-radius:3px; width:0%; transition:width 0.1s linear; }

    #ctx-switches { font-size:0.72rem; color:var(--nord4); text-align:center; }

    /* ── Gantt section ───────────────────────────────────── */
    #gantt-section {
      flex-shrink: 0;
      height: 82px;
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--nord2);
    }

    #gantt-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.3rem 0.75rem;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--nord8);
      background: var(--nord1);
      border-bottom: 1px solid var(--nord2);
      flex-shrink: 0;
    }

    #btn-gantt-live {
      font-size: 0.65rem;
      padding: 0.1rem 0.5rem;
      border-radius: 999px;
      background: var(--nord11);
      border-color: var(--nord11);
      color: var(--nord6);
      animation: pulse-live 1.6s ease-in-out infinite;
    }

    @keyframes pulse-live {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.65; }
    }

    #gantt-canvas { cursor: default; }

    #gantt-wrap {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    #gantt-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: block;
    }

    /* ── Footer / Stats ──────────────────────────────────── */
    #footer {
      display: flex;
      gap: 2rem;
      padding: 0.45rem 1rem;
      background: var(--nord1);
      border-top: 1px solid var(--nord3);
      flex-shrink: 0;
      font-size: 0.78rem;
    }
    #footer b { color: var(--nord13); }

    /* ── Math Modal ──────────────────────────────────────── */
    #math-modal[hidden], #log-modal[hidden] { display:none; }
    #math-modal, #log-modal {
      position:fixed; inset:0;
      display:grid; place-items:center;
      background:rgba(46,52,64,0.82);
      z-index:50;
    }
    .modal-panel {
      width: min(680px, calc(100vw - 2rem));
      max-height: calc(100vh - 2rem);
      overflow: auto;
      background: var(--nord1);
      border: 1px solid var(--nord3);
      border-radius: 16px;
      padding: 1.25rem;
    }
    .modal-header {
      display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;
    }
    .modal-header h2 { color:var(--nord8); font-size:0.9rem; }
    .modal-actions { display:flex; gap:0.45rem; }
    .modal-body {
      display:grid; gap:0.75rem; line-height:1.75; color:var(--nord5); font-size:0.83rem;
    }
    .modal-body pre[class*=language-] { border-radius:6px; font-size:0.78rem; }

    /* ── Priority badge ──────────────────────────────────── */
    .priority-badge {
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      border-radius: 3px;
      font-size: 0.68rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--nord0);
    }
    .priority-badge.p1 { background: var(--nord11); }
    .priority-badge.p2 { background: var(--nord12); }
    .priority-badge.p3 { background: var(--nord13); }
    .priority-badge.p4 { background: var(--nord14); }
    .priority-badge.p5 { background: var(--nord3); color: var(--nord6); }

    /* ── MLFQ group header ───────────────────────────────── */
    .mlfq-header {
      font-size: 0.6rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--nord9);
      padding: 0.25rem 0.3rem 0.05rem;
      flex-shrink: 0;
    }

    /* ── MLFQ level tag (inline on current task) ─────────── */
    .mlfq-level-tag {
      font-size: 0.6rem;
      font-weight: 700;
      background: rgba(0,0,0,0.25);
      color: rgba(0,0,0,0.7);
      border-radius: 3px;
      padding: 0 3px;
      margin-left: 2px;
      vertical-align: middle;
    }

    /* ── EDF deadline-missed ─────────────────────────────── */
    .task-block.deadline-missed {
      border: 2px dashed var(--nord11) !important;
      opacity: 0.78;
    }

    /* ── Log modal ───────────────────────────────────────── */
    .log-summary {
      font-size: 0.75rem;
      color: var(--nord4);
      margin-bottom: 0.6rem;
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
    }
    .log-summary b { color: var(--nord13); }

    .log-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
    }
    .log-table th {
      color: var(--nord8);
      text-align: left;
      padding: 4px 10px;
      border-bottom: 1px solid var(--nord3);
      font-size: 0.67rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      white-space: nowrap;
    }
    .log-table td {
      padding: 5px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      color: var(--nord5);
      white-space: nowrap;
    }
    .log-table tbody tr:last-child td { border-bottom: none; }
    .log-table tbody tr:hover td { background: rgba(255,255,255,0.03); }

    .task-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      color: rgba(0,0,0,0.75);
    }

    .log-warn { color: var(--nord11); font-weight: 600; }
    .log-empty {
      text-align: center;
      color: var(--nord3);
      padding: 2rem 0;
      font-size: 0.85rem;
    }

    /* ── Global tooltip ──────────────────────────────────── */
    #tooltip {
      position: fixed;
      z-index: 200;
      background: var(--nord0);
      color: var(--nord6);
      border: 1px solid var(--nord3);
      border-radius: 5px;
      padding: 4px 9px;
      font-size: 0.72rem;
      line-height: 1.45;
      pointer-events: none;
      max-width: 240px;
      white-space: pre-wrap;
      box-shadow: 0 3px 10px rgba(0,0,0,0.4);
    }
    #tooltip[hidden] { display: none; }
  </style>
</head>
<body>

<header id="header">
  <label>
    Algorithm
    <div class="select-wrap">
    <select id="algo-select">
      <option value="FCFS">FCFS</option>
      <option value="SJF">SJF</option>
      <option value="RR">RR</option>
      <option value="SRTF">SRTF</option>
      <option value="Priority">Priority</option>
      <option value="MLFQ">MLFQ</option>
      <option value="HRRN">HRRN</option>
      <option value="Lottery">Lottery</option>
      <option value="EDF">EDF</option>
    </select>
    </div>
  </label>

  <div id="speed-group">
    <span>Speed</span>
    <button id="btn-pause">Pause</button>
    <button id="btn-step" title="Advance 0.5 sim-seconds">Step</button>
    <button class="speed-btn" data-spd="0.5">0.5×</button>
    <button class="speed-btn active" data-spd="1">1×</button>
    <button class="speed-btn" data-spd="2">2×</button>
    <button class="speed-btn" data-spd="4">4×</button>
  </div>

  <div id="quantum-group" hidden>
    <label>
      Quantum
      <input type="range" id="quantum-slider" min="0.5" max="5" step="0.5" value="2" />
      <span id="quantum-val">2.0 s</span>
    </label>
  </div>

  <button id="btn-reset">Reset</button>
  <button id="btn-math" title="Math behind the scene" style="font-size:1rem">💡</button>
  <button id="btn-log"  title="Task completion log"   style="font-size:1rem">📋</button>

  <div id="sim-clock">T = 0.0 s</div>
</header>

<main id="main">

  <section id="producer">
    <h2 data-tooltip="Process Creator（生產者）&#10;模擬作業系統持續建立新 Process 的機制。&#10;每隔固定時間產生一個 Task，送入 Ready Queue，&#10;等待排程器分配 CPU 使用權。">Producer</h2>
    <div id="factory">
      <span id="factory-icon">⚙️</span>
      <div id="factory-label">Running</div>
      <div id="factory-total">0 / 12</div>
      <button id="btn-spawn" hidden>＋ Spawn</button>
    </div>

    <div id="prod-controls">
      <div class="prod-row">
        <span class="prod-label">Interval</span>
        <input type="range" id="interval-slider" min="0.3" max="5" step="0.1" value="1" />
        <span id="interval-val" class="prod-val">1.0 s</span>
      </div>
      <div class="prod-row prod-btns">
        <button id="btn-prod-one" title="Spawn one task now">＋1</button>
        <button id="btn-prod-auto" class="active" title="Auto generate">▶ Auto</button>
        <button id="btn-prod-stop" title="Stop auto generate">■ Stop</button>
      </div>
    </div>
  </section>

  <section id="ready-queue-section">
    <h2>Current Queue <span id="queue-count">(0)</span></h2>
    <div id="queue-list"></div>
  </section>

  <section id="cpu-section">
    <h2 data-tooltip="Processor Core（處理器核心）&#10;模擬 CPU 每次只能執行一個 Process。&#10;排程器決定哪個 Task 獲得使用權，&#10;切換時產生 Context Switch 開銷。">CPU Core</h2>
    <div id="cpu-slot">
      <span id="cpu-task-id"   style="color:var(--nord4)">Idle</span>
      <span id="cpu-remaining" style="color:var(--nord3)">—</span>
    </div>
    <div class="bar-wrap"><div id="cpu-bar"></div></div>
    <div id="ctx-switches">Context Switches: 0</div>
  </section>

</main>

<section id="gantt-section">
  <div id="gantt-header">
    <span>Execution Timeline</span>
    <button id="btn-gantt-live" hidden>● Live</button>
  </div>
  <div id="gantt-wrap">
    <canvas id="gantt-canvas"></canvas>
  </div>
</section>

<footer id="footer">
  <span>Completed: <b id="s-done">0</b></span>
  <span>Avg Wait: <b id="s-wait">—</b></span>
  <span>CPU Util: <b id="s-util">—</b></span>
  <span>Throughput: <b id="s-tput">—</b></span>
  <span id="s-missed" hidden>Missed DL: <b id="s-missed-count">0</b></span>
</footer>

<div id="math-modal" role="dialog" aria-modal="true" hidden>
  <div class="modal-panel">
    <div class="modal-header">
      <h2>Math Behind the Scene</h2>
      <div class="modal-actions">
        <button id="lang-toggle">Eng/中</button>
        <button id="close-modal">Close</button>
      </div>
    </div>
    <div id="math-content" class="modal-body"></div>
  </div>
</div>

<div id="log-modal" role="dialog" aria-modal="true" hidden>
  <div class="modal-panel" style="max-width:700px">
    <div class="modal-header">
      <h2>Task Completion Log</h2>
      <button id="close-log-modal">Close</button>
    </div>
    <div id="log-summary" class="log-summary"></div>
    <div id="log-content"></div>
  </div>
</div>

<div id="tooltip" hidden></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
